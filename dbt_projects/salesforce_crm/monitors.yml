version: 2

monitors:
  - name: stg_sf_accounts_volume
    model: ref('stg_sf_accounts')
    description: Monitor row count for staging accounts table
    type: volume
    config:
      fail_threshold: 0
      warn_threshold: 100
    meta:
      owner: data_engineering
      severity: high

  - name: stg_sf_accounts_freshness
    model: ref('stg_sf_accounts')
    description: Monitor data freshness for staging accounts
    type: freshness
    timestamp_column: updated_at
    config:
      warn_after:
        count: 24
        period: hour
      error_after:
        count: 48
        period: hour
    meta:
      owner: data_engineering
      severity: critical

  - name: stg_sf_accounts_schema
    model: ref('stg_sf_accounts')
    description: Detect schema changes in staging accounts table
    type: schema_change
    config:
      block_on_new_columns: false
      block_on_removed_columns: true
      block_on_type_changes: true
    meta:
      owner: data_engineering
      severity: medium

  - name: stg_sf_contacts_volume
    model: ref('stg_sf_contacts')
    description: Monitor row count for staging contacts table
    type: volume
    config:
      fail_threshold: 0
